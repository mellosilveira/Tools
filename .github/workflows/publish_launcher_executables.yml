# This workflow builds self-contained single-file executables of MelloSilveiraTools.Launcher
# for Windows (x64, arm64), macOS (x64, arm64), and Linux (x64, arm64).

name: Build and publish Launcher executables

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'src/MelloSilveiraTools.Launcher/**'
      - 'src/MelloSilveiraTools.Database.Migrator/**'
      - '.github/workflows/publish_launcher_executables.yml'

env:
  CONFIGURATION: Release
  DOTNET_VERSION: 10.x
  LAUNCHER_PROJECT: src/MelloSilveiraTools.Launcher/MelloSilveiraTools.Launcher.csproj

jobs:
  publish-launcher:
    name: Publish Launcher (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            archive_ext: zip
            binary_name: MelloSilveiraTools.Launcher.exe
            can_execute_smoke: true
          - rid: win-arm64
            os: windows-latest
            archive_ext: zip
            binary_name: MelloSilveiraTools.Launcher.exe
            can_execute_smoke: false
          - rid: osx-x64
            os: macos-latest
            archive_ext: tar.gz
            binary_name: MelloSilveiraTools.Launcher
            can_execute_smoke: false
          - rid: osx-arm64
            os: macos-latest
            archive_ext: tar.gz
            binary_name: MelloSilveiraTools.Launcher
            can_execute_smoke: true
          - rid: linux-x64
            os: ubuntu-latest
            archive_ext: tar.gz
            binary_name: MelloSilveiraTools.Launcher
            can_execute_smoke: true
          - rid: linux-arm64
            os: ubuntu-latest
            archive_ext: tar.gz
            binary_name: MelloSilveiraTools.Launcher
            can_execute_smoke: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish self-contained single-file executable (${{ matrix.rid }})
        run: >
          dotnet publish "${{ env.LAUNCHER_PROJECT }}"
          --configuration ${{ env.CONFIGURATION }}
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:GeneratePackageOnBuild=false
          -p:DebugType=none
          -p:DebugSymbols=false
          --output "build/launcher/${{ matrix.rid }}"

      - name: Smoke-test native Launcher executable (--help)
        if: matrix.can_execute_smoke
        shell: bash
        run: |
          chmod +x "build/launcher/${{ matrix.rid }}/${{ matrix.binary_name }}" || true
          "build/launcher/${{ matrix.rid }}/${{ matrix.binary_name }}" --help

      - name: Package Windows archive (${{ matrix.rid }})
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/launcher-dist | Out-Null
          $archivePath = "build/launcher-dist/MelloSilveiraTools.Launcher-${{ matrix.rid }}.zip"
          Compress-Archive -Path "build/launcher/${{ matrix.rid }}/${{ matrix.binary_name }}" -DestinationPath $archivePath -Force

      - name: Package Unix archive (${{ matrix.rid }})
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          mkdir -p build/launcher-dist
          chmod +x "build/launcher/${{ matrix.rid }}/${{ matrix.binary_name }}"
          tar -czf "build/launcher-dist/MelloSilveiraTools.Launcher-${{ matrix.rid }}.tar.gz" -C "build/launcher/${{ matrix.rid }}" "${{ matrix.binary_name }}"

      - name: Upload Launcher artifact (${{ matrix.rid }})
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.rid }}
          path: build/launcher-dist/MelloSilveiraTools.Launcher-${{ matrix.rid }}.${{ matrix.archive_ext }}

  release-launcher:
    name: Bundle Checksums & Attach to Release
    needs: publish-launcher
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all Launcher archives
        uses: actions/download-artifact@v4
        with:
          pattern: launcher-*
          path: build/launcher-release
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd build/launcher-release
          sha256sum MelloSilveiraTools.Launcher-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload combined release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-all-platforms
          path: build/launcher-release/

      - name: Attach executables to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/launcher-release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
