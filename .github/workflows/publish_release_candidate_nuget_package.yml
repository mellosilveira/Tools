# This workflow builds, runs unit tests, and conditionally publishes RC packages on every PR that touches sources / project files.

name: Build and publish .NET nuget packages (release candidate)

on:
  pull_request:
    paths:
      - '**/Directory.Build.props'
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
      - '.github/workflows/**'

env:
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 10.x
  ARTIFACT_NAME: ${{ vars.ARTIFACT_NAME }}
  UPLOAD_PATH: build/nupkgs/
  TARGET_PATH: ${{ vars.TARGET_PATH }}
  NUGET_USER: ${{ secrets.NUGET_USER }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      Version: ${{ steps.check_version.outputs.version }}
      ShouldPublish: ${{ steps.check_version.outputs.should_publish }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

    - name: Restore solution
      run: dotnet restore MelloSilveiraTools.sln

    - name: Build solution
      run: dotnet build MelloSilveiraTools.sln --configuration ${{ env.CONFIGURATION }} --no-restore

    - name: Run unit tests
      run: dotnet test test/UnitTests/UnitTests.csproj --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal

    - name: Run acceptance tests
      run: dotnet test test/AcceptanceTests/AcceptanceTests.csproj --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal

    # All packages share the same VersionPrefix in Directory.Build.props (lockstep release).
    # Only pack and publish when the version is an RC ("*rc*") AND increments the existing RC.
    - name: Check if version is a new RC
      id: check_version
      run: |
        version=$(grep -oPm1 "(?<=<VersionPrefix>)[^<]+" Directory.Build.props)
        echo "Detected current version: $version"
        echo "version=$version" >> $GITHUB_OUTPUT

        if [[ "$version" != *rc* ]]; then
          echo "Version '$version' does not contain 'rc'. Skipping NuGet publish."
          echo "should_publish=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        base_ref="${{ github.base_ref }}"
        base_version=""
        if [[ -n "$base_ref" ]] && git cat-file -e "origin/${base_ref}:Directory.Build.props" 2>/dev/null; then
          base_version=$(git show "origin/${base_ref}:Directory.Build.props" | grep -oPm1 "(?<=<VersionPrefix>)[^<]+" || true)
        fi
        echo "Detected base branch ($base_ref) version: ${base_version:-none}"

        if [[ -n "$base_version" && "$base_version" == *rc* ]]; then
          if [[ "$version" == "$base_version" ]]; then
            echo "RC version '$version' was not incremented relative to base branch ('$base_version'). Skipping NuGet publish."
            echo "should_publish=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          highest_version=$(printf '%s\n%s\n' "$base_version" "$version" | sort -V | tail -n1)
          if [[ "$highest_version" != "$version" ]]; then
            echo "RC version '$version' is lower than base branch version '$base_version'. Skipping NuGet publish."
            echo "should_publish=false" >> $GITHUB_OUTPUT
            exit 0
          fi
        fi

        version_lower=$(echo "$version" | tr '[:upper:]' '[:lower:]')
        nuget_versions=$(curl -s "https://api.nuget.org/v3-flatcontainer/mellosilveiratools/index.json" || true)
        if echo "$nuget_versions" | grep -qi "\"${version_lower}\""; then
          echo "RC version '$version' is already published on NuGet.org. Skipping NuGet publish."
          echo "should_publish=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo "New RC version '$version' detected. Proceeding with pack and publish."
        echo "should_publish=true" >> $GITHUB_OUTPUT

    - name: Pack every NuGet package
      if: steps.check_version.outputs.should_publish == 'true'
      run: dotnet pack MelloSilveiraTools.sln --configuration ${{ env.CONFIGURATION }} --no-build --output ${{ env.UPLOAD_PATH }}

    - name: List produced packages
      if: steps.check_version.outputs.should_publish == 'true'
      run: ls -la ${{ env.UPLOAD_PATH }}

    - name: Upload NuGet packages artifact
      if: steps.check_version.outputs.should_publish == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ env.UPLOAD_PATH }}

  release:
    if: needs.build.outputs.ShouldPublish == 'true'
    environment: production_pakages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Download nuget packages artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ env.TARGET_PATH }}
    - name: List downloaded packages
      run: ls -la ${{ env.TARGET_PATH }}
    # Get a short-lived NuGet API key
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ env.NUGET_USER }}
    - name: Publish all RC packages to nuget.org
      run: dotnet nuget push "${{ env.TARGET_PATH }}/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
