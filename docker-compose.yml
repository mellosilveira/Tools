services:
  postgres:
    image: postgres:17-alpine
    container_name: tools_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: tools_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - tools_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tools_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: .
      dockerfile: src/MelloSilveiraTools.Database.Migrator/Dockerfile
    container_name: tools_migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CONNECTION_STRING: Host=postgres;Port=5432;Database=tools_db;Username=postgres;Password=postgres;
    restart: "no"

  webapi:
    build:
      context: .
      dockerfile: src/MelloSilveiraTools.WebApi.Host/Dockerfile
    container_name: tools_webapi
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    ports:
      - "5080:8080"
    volumes:
      - tools_storage_data:/app/storage
    restart: unless-stopped

volumes:
  tools_postgres_data:
  tools_storage_data:
