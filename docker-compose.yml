services:
  postgres:
    image: postgres:17-alpine
    container_name: tools_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: tools_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - tools_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tools_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tools_postgres_data:
