services:
  postgres:
    image: postgres:17-alpine
    container_name: tools_postgres
    restart: unless-stopped
    ports:
      - "${TOOLS_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: tools_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - tools_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tools_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: .
      dockerfile: src/MelloSilveiraTools.Database.Migrator/Dockerfile
    container_name: tools_migrator
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - "--connection-string"
      - "${TOOLS_DOCKER_MIGRATOR_CONNECTION_STRING:-Host=postgres;Port=5432;Database=tools_db;Username=postgres;Password=postgres;}"
      - "--context"
      - "${TOOLS_MIGRATION_CONTEXT:-All}"
      - "--timeout"
      - "${TOOLS_MIGRATION_TIMEOUT:-60}"
    restart: "no"

  webapi:
    build:
      context: .
      dockerfile: src/MelloSilveiraTools.WebApi.Host/Dockerfile
    container_name: tools_webapi
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      # Supplied automatically by MelloSilveiraTools.Launcher (--docker), or provide non-placeholder host env vars.
      Database__ConnectionString: ${TOOLS_DOCKER_APP_CONNECTION_STRING:-Host=postgres;Port=5432;Database=tools_db;Username=tools_app;Password=tools_app_pass;}
      Jwt__EncryptionKey: ${JWT__ENCRYPTIONKEY:-}
      Jwt__SigningKey: ${JWT__SIGNINGKEY:-}
      Superuser__Password: ${SUPERUSER__PASSWORD:-}
      ASPNETCORE_URLS: ${TOOLS_DOCKER_URLS:-http://+:26324}
      URLS: ${TOOLS_DOCKER_URLS:-http://+:26324}
      Kestrel__Certificates__Default__Password: ${TOOLS_DOCKER_CERT_PASSWORD:-mellosilveiratools}
    ports:
      - "${TOOLS_WEBAPI_HTTP_PORT:-26324}:${TOOLS_WEBAPI_HTTP_PORT:-26324}"
      - "${TOOLS_WEBAPI_HTTPS_PORT:-24263}:${TOOLS_WEBAPI_HTTPS_PORT:-24263}"
    volumes:
      - tools_storage_data:/app/storage
      - ${TOOLS_HTTPS_CERT_FILE:-./build/certs/https-cert.pfx}:/app/https-cert.pfx:ro
    restart: unless-stopped

volumes:
  tools_postgres_data:
  tools_storage_data:
